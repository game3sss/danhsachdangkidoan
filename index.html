<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách đăng kí Đoàn</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --card: rgba(255,255,255,.92);
      --shadow: 0 20px 50px rgba(15, 23, 42, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 30%),
        radial-gradient(circle at top right, rgba(22,163,74,.14), transparent 25%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .hero {
      background: linear-gradient(135deg, #1e40af, #2563eb 48%, #38bdf8);
      color: white;
      border-radius: 26px;
      padding: 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      position: absolute;
      right: -90px;
      top: -100px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: -.03em;
    }

    .hero p {
      margin: 0;
      font-size: 16px;
      opacity: .92;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .08);
    }

    .stat-card span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 34px;
      line-height: 1;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .08);
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      position: sticky;
      top: 10px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
    }

    .select,
    .btn {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 15px;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      transition: .2s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .table-card {
      background: var(--card);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead th {
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 14px;
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
      font-size: 15px;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .stt {
      width: 76px;
      color: var(--muted);
      font-weight: 800;
    }

    .name {
      font-weight: 800;
      color: #111827;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .badge.done {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge.wait {
      background: var(--red-bg);
      color: var(--red);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 14px;
      text-align: right;
    }

    .empty {
      display: none;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
        position: static;
      }

      .table-card {
        overflow-x: auto;
      }

      table {
        min-width: 760px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .hero,
      .toolbar,
      .footer-note {
        box-shadow: none;
      }

      .toolbar {
        display: none;
      }

      .page {
        width: 100%;
        padding: 0;
      }

      .hero {
        color: #000;
        background: white;
        border: 1px solid #ddd;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .table-card {
        box-shadow: none;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>

    <section class="hero">
      <h1>Danh sách đăng kí Đoàn</h1>
      <p>Quản lý trạng thái đăng kí theo danh sách lớp. Người đã có trong danh sách đăng kí sẽ hiển thị “Đã đăng kí”.</p>

    <section class="toolbar">

        <option value="wait">Chưa đăng kí</option>
      </select>
      <button class="btn" onclick="window.print()">In danh sách</button>

    </section>

    <section class="table-card">

    </section>

    <div class="footer-note">Cập nhật: 11/06/2026 16:50</div>
  </main>

    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const emptyState = document.getElementById("emptyState");
    const totalCount = document.getElementById("totalCount");
    const doneCount = document.getElementById("doneCount");
    const waitCount = document.getElementById("waitCount");

    function removeVietnameseTones(str) {
      return str
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim();
    }

    function renderTable() {
      const keyword = removeVietnameseTones(searchInput.value);
      const filter = statusFilter.value;

      const filtered = people.filter(person => {
        const matchKeyword = removeVietnameseTones(person.hoTen).includes(keyword);
        const matchStatus =
          filter === "all" ||
          (filter === "done" && person.registered) ||
          (filter === "wait" && !person.registered);

        return matchKeyword && matchStatus;
      });

      tableBody.innerHTML = filtered.map((person, index) => `
        <tr>
          <td class="stt">${index + 1}</td>
          <td>${person.hoDem}</td>
          <td><strong>${person.ten}</strong></td>
          <td class="name">${person.hoTen}</td>
          <td>
            <span class="badge ${person.registered ? "done" : "wait"}">
              <span class="dot"></span>
              ${person.trangThai}
            </span>
          </td>
        </tr>
      `).join("");

      emptyState.style.display = filtered.length ? "none" : "block";
      updateStats(filtered);
    }

    function updateStats(list) {
      const done = list.filter(item => item.registered).length;
      const wait = list.length - done;

      totalCount.textContent = list.length;
      doneCount.textContent = done;
      waitCount.textContent = wait;
    }

    function exportCSV() {
      const header = ["STT", "Họ và đệm", "Tên", "Họ tên đầy đủ", "Trạng thái"];
      const csvRows = people.map((person, index) => [
        index + 1,
        person.hoDem,
        person.ten,
        person.hoTen,
        person.trangThai
      ]);

      const csvContent = [header, ...csvRows]
        .map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob(["\ufeff" + csvContent], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "danh-sach-dang-ki-doan.csv";
      link.click();
      URL.revokeObjectURL(link.href);
    }

    searchInput.addEventListener("input", renderTable);
    statusFilter.addEventListener("change", renderTable);

    renderTable();
  </script>

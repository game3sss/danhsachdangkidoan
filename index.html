<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách đã đăng kí</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe, #f8fafc 45%, #dbeafe);
      color: #0f172a;
      padding: 28px 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: linear-gradient(135deg, #0f4c81, #1d4ed8);
      color: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 18px 40px rgba(15, 76, 129, 0.25);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      right: -70px;
      top: -80px;
    }

    .header h1 {
      font-size: clamp(26px, 4vw, 42px);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
    }

    .header p {
      font-size: 16px;
      opacity: 0.95;
      position: relative;
      z-index: 2;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .stat-card span {
      display: block;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
      color: #1d4ed8;
    }

    .toolbar {
      background: white;
      padding: 18px;
      border-radius: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: #0f172a;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      color: white;
      background: #1d4ed8;
      transition: 0.2s;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.25);
    }

    .btn-green {
      background: #059669;
    }

    .table-card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #0f4c81;
      color: white;
    }

    th, td {
      padding: 15px 18px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th:first-child, td:first-child {
      width: 90px;
      text-align: center;
      font-weight: 700;
    }

    tbody tr {
      transition: 0.18s;
    }

    tbody tr:hover {
      background: #eff6ff;
    }

    .name {
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 26px;
      color: #64748b;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      body {
        padding: 16px 10px;
      }

      .header {
        padding: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .buttons {
        flex-direction: column;
      }

      th, td {
        padding: 13px 10px;
        font-size: 14px;
      }

      th:first-child, td:first-child {
        width: 58px;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .header, .toolbar, .stats, .footer {
        box-shadow: none;
      }

      .toolbar, .footer {
        display: none;
      }

      .header {
        color: #000;
        background: white;
        border: 1px solid #000;
        border-radius: 0;
      }

      .table-card {
        box-shadow: none;
        border: none;
        border-radius: 0;
      }

      thead {
        background: #ddd !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <h1>Danh sách đã đăng kí</h1>
      <p>Quản lý danh sách người đã đăng kí nhanh, rõ ràng và dễ tra cứu.</p>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span>Tổng số người</span>
        <strong id="totalCount">27</strong>
      </div>
      <div class="stat-card">
        <span>Trạng thái</span>
        <strong>Đã đăng kí</strong>
      </div>
      <div class="stat-card">
        <span>Ngày cập nhật</span>
        <strong id="todayText"></strong>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <span>🔎</span>
        <input id="searchInput" type="text" placeholder="Nhập tên cần tìm..." />
      </div>
      <div class="buttons">
        <button onclick="window.print()">In danh sách</button>
        <button class="btn-green" onclick="exportCSV()">Xuất CSV</button>
      </div>
    </section>

    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
      <div id="emptyText" class="empty">Không tìm thấy tên phù hợp.</div>
    </section>

    <div class="footer">© Danh sách đã đăng kí - Thiết kế HTML/CSS/JavaScript</div>
  </main>

  <script>
    const danhSach = [
      "ĐOÀN DUY MẠNH",
      "NGUYỄN VĂN MẠNH",
      "ĐOÀN ĐÌNH HẬU",
      "PHÍ TRƯỜNG GIANG",
      "NGUYỄN NGỌC HIỆP",
      "LÊ DUY HÒA",
      "TRẦN HẬU HUÂN",
      "LƯƠNG QUANG HUY",
      "NGUYỄN ĐÌNH HUY",
      "LÂM DUY KHÁNH",
      "NGỌC MINH KIÊN",
      "TRẦN VĂN LÂM",
      "VŨ VIỆT LONG",
      "NGUYỄN MẠNH ĐIỀM",
      "NGUYỄN VỌNG",
      "ĐÀO ĐỨC PHONG",
      "VƯƠNG TRỌNG HẢI QUÂN",
      "LƯƠNG QUỐC BẢO",
      "LÊ ANH SƠN",
      "NGUYỄN MINH SƠN",
      "TRẦN ĐỨC THANH",
      "HOÀNG VĂN THI",
      "NGUYỄN VĂN THUYẾT",
      "NGUYỄN TIẾN LỰC",
      "NGUYỄN THÀNH TRUNG",
      "VŨ ANH TUẤN",
      "VŨ DUY MẠNH"
    ];

    const tbody = document.getElementById("studentTable");
    const searchInput = document.getElementById("searchInput");
    const totalCount = document.getElementById("totalCount");
    const emptyText = document.getElementById("emptyText");
    const todayText = document.getElementById("todayText");

    function removeVietnameseTones(str) {
      return str
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase();
    }

    function renderTable(data) {
      tbody.innerHTML = "";
      emptyText.style.display = data.length === 0 ? "block" : "none";
      totalCount.textContent = data.length;

      data.forEach((name, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td class="name">${name}</td>
          <td><span class="badge">Đã đăng kí</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    searchInput.addEventListener("input", function () {
      const keyword = removeVietnameseTones(this.value.trim());
      const filtered = danhSach.filter(name =>
        removeVietnameseTones(name).includes(keyword)
      );
      renderTable(filtered);
    });

    function exportCSV() {
      const rows = [["STT", "Ho va ten", "Trang thai"]];
      danhSach.forEach((name, index) => {
        rows.push([index + 1, name, "Da dang ki"]);
      });

      const csvContent = "\uFEFF" + rows.map(row => row.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "danh-sach-da-dang-ki.csv";
      link.click();
    }

    const now = new Date();
    todayText.textContent = now.toLocaleDateString("vi-VN");
    renderTable(danhSach);
  </script>
</body>
</html>
